name: Build Kivy APK

on: [push, workflow_dispatch]  # Запуск по push или вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Настройка Java (обязательно для Gradle)
    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    # Настройка Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'  # Выберите стабильную версию

    # Установка системных зависимостей
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    # Установка Buildozer
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython

    # Кэширование для ускорения следующих сборок
    - name: Cache Buildozer global directory
      uses: actions/cache@v3
      with:
        path: .buildozer_global
        key: buildozer-global-${{ hashFiles('buildozer.spec') }}

    # Сама сборка APK
    - name: Build with Buildozer
      run: |
        yes | buildozer -v android debug

    # Сохранение готового APK как артефакта
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-kivy-app
        path: bin/*.apk
